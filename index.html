<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Майнинг Прыжок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: one-screen app — top balance bar, swappable screen, bottom tab bar (Telegram Mini App shape) */
:root{
  --ink:#f2f8f3; --panel:#ffffff; --panel2:#e4f1e8; --line:#d2e5d8;
  --fg:#12301f; --muted:#5f7b69; --gold:#1d9e57; --gold-d:#157a42;
  --up:#14a053; --down:#d94848; --r-common:#5f9e74; --r-rare:#3f8fd6; --r-legend:#d1901a; --star:#f2a900; --sky1:#e9f7ee; --sky2:#c6ead3;
  --f-disp:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body,.top,.ticker,nav,.card,.claim,.stat,.house,.bxcard{transition:background-color .6s,color .6s,border-color .6s}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bal small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.bal b{font-family:var(--f-num);font-size:26px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.rate{text-align:right;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.rate b{color:var(--up);font-size:14px;display:block}
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--panel);white-space:nowrap;font-family:var(--f-num);font-size:12px}
.ticker-in{display:inline-flex;gap:22px;padding:7px 0;animation:tick 28s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-in{animation:none}}
.tk{display:inline-flex;gap:6px}.tk i{font-style:normal;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
main{flex:1;min-height:0;overflow-y:auto;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.game{padding:0;overflow:hidden;position:relative}
h2{font-family:var(--f-disp);font-size:18px;font-weight:800;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;line-height:1.45}
.stack{display:grid;gap:10px}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.locked{opacity:.45}
.chip{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-size:12px;font-weight:800;color:#0d0e19;position:relative;overflow:hidden}
.chip::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.12) 6px 7px)}
.chip span{position:relative;z-index:1}
.chip.acc{background:var(--gold);color:#fff}
.chip.coin{border-radius:50%;background:radial-gradient(circle at 34% 28%,var(--c1),var(--c2) 50%,var(--c3) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),inset 0 0 0 5px rgba(0,0,0,.2),0 4px 8px rgba(0,0,0,.35);font-size:11px;color:rgba(0,0,0,.68);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.chip.coin::after{background:linear-gradient(140deg,rgba(255,255,255,.45),transparent 42%);border-radius:50%}
.chip.ico{background:radial-gradient(circle at 50% 35%,var(--panel2),var(--panel));border:1px solid var(--line);overflow:visible}
.chip.ico::after{display:none}
.chip.ico svg{width:42px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.chip.ico .lvb{position:absolute;right:-5px;bottom:-5px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--gold);color:var(--on-acc,#fff);font:700 11px var(--f-num);display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel)}
.chip.star{background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc93c 45%,#d98a0a)!important;color:#fff!important;text-shadow:0 1px 2px rgba(120,60,0,.6);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 4px 10px rgba(255,170,30,.35)}
.card,.price-row,.skin,.claim{box-shadow:0 1px 2px rgba(18,48,31,.06)}
.meta{min-width:0}
.meta b{font-size:15px;display:block}
.meta .l{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.meta .inc{font-family:var(--f-num);font-size:12px;color:var(--up)}
.btn{font:700 13px var(--f-body);border:0;border-radius:10px;padding:10px 12px;background:var(--gold);color:#fff;cursor:pointer;min-width:84px;font-variant-numeric:tabular-nums}
.btn:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.claim{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.claim .v{font-family:var(--f-num);font-size:20px;color:var(--gold);font-weight:700}
.claim small{color:var(--muted);display:block;font-size:12px}
.sect{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.skin{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;justify-items:center;text-align:center}
.skin.on{border-color:var(--gold)}
.skin canvas{width:88px;height:88px;border-radius:12px;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--gold) 12%,transparent),transparent 70%)}
.skin b{font-size:13px}
.price-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.price-row .p{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.price-row .p b{display:block;font-size:15px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:var(--muted);font:700 10px var(--f-body);padding:9px 0 10px;display:grid;justify-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--gold)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;font-family:var(--f-num);pointer-events:none}
.hud b{font-size:22px;color:var(--hudfg,var(--fg))}.hud small{color:var(--hudmut,var(--muted));display:block;font-size:11px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,48,31,.35);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.ov{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(340px,100%);text-align:center;display:grid;gap:10px}
.ov h3{font-family:var(--f-disp);font-size:22px;margin:0}
.ov .big{font-family:var(--f-num);font-size:30px;color:var(--gold);font-weight:700}
.ov p{margin:0;color:var(--muted);line-height:1.45}
.kv{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:13px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--gold);color:#fff;font-weight:700;padding:10px 16px;border-radius:12px;z-index:20;transition:opacity .3s}
.welcome h3{font-size:20px}
.prof{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.prof canvas{width:72px;height:72px;background:var(--panel2);border-radius:14px}
.prof .nm{display:flex;gap:8px;min-width:0}
.prof input{flex:1;min-width:0;font:700 16px var(--f-body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.prof input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.prof .rk{font-size:12px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.prog{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.prow .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.prow .bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.prow span:last-child{text-align:right;font-family:var(--f-num);color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:3px}
.ach b{font-size:13px}.ach small{color:var(--muted);font-size:12px;line-height:1.35}
.ach .rw{font-family:var(--f-num);font-size:12px;color:var(--gold)}
.ach.off{opacity:.5}.ach.on{border-color:var(--gold);background:linear-gradient(135deg,var(--panel2),var(--panel))}
.lb{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lr{display:grid;grid-template-columns:30px 28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.lr:first-child{border-top:0}
.lr .n{font-family:var(--f-num);color:var(--muted);text-align:center}
.lr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lr .sc{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.lr .sc small{display:block;color:var(--muted);font-size:11px}
.lr.me{background:var(--panel2)}
.lr .medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bchip{font:700 12px var(--f-num);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--fg)}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;gap:8px;justify-items:center;text-align:center;min-width:0}
.case .box{width:54px;height:46px;border-radius:9px;position:relative;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.case .box::before{content:"";position:absolute;left:0;right:0;top:14px;height:6px;background:rgba(255,255,255,.55)}
.case .box::after{content:"";position:absolute;left:22px;top:9px;width:10px;height:16px;border-radius:3px;background:#fff;opacity:.85}
.case b{font-size:13px}.case small{color:var(--muted);font-size:11px;line-height:1.3}
.case .btn{min-width:0;width:100%;padding-inline:6px}
.rar{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.chip.star{background:var(--star);color:#fff;font-size:18px}
.btn.star{background:var(--star);color:#fff}
.reel{font-family:var(--f-disp);font-size:18px;min-height:52px;display:grid;place-items:center;text-wrap:balance}
.langs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.langs button{font:700 12px var(--f-body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.langs button.on{background:var(--panel);color:var(--gold);box-shadow:0 1px 2px rgba(18,48,31,.12)}
.langs button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.av{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:inline-grid;place-items:center;font-size:16px;line-height:1;overflow:hidden}
.bigav{width:72px;height:72px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:40px;line-height:1}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.avs button{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;background:var(--panel);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;min-width:0}
.avs button.on{border-color:var(--gold);background:var(--panel2)}
.avs button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.avs canvas{width:32px;height:32px}
.house{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(var(--panel2),var(--panel));box-shadow:0 1px 2px rgba(18,48,31,.06)}
.wall{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 14px 6px;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(18,48,31,.035) 38px 40px)}
.wincol{display:grid;justify-items:center;gap:4px}
.wlabel{font:700 10px var(--f-body);color:var(--muted);white-space:nowrap}
.win canvas{display:block;width:100%;height:100%}
.win{width:110px;height:74px;border:4px solid #fff;border-radius:8px;position:relative;background:linear-gradient(#8fd3ff,#d9f2ff);box-shadow:0 2px 0 rgba(18,48,31,.12);overflow:hidden}
.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff}
.win::after{content:"";position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:#fff}


.clock{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #3a404c;position:relative;flex:none;align-self:center;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.clock i{position:absolute;left:50%;bottom:50%;width:2px;margin-left:-1px;background:#3a404c;transform-origin:50% 100%;border-radius:2px}
.clock .hh{height:9px;width:3px;margin-left:-1.5px}.clock .mm{height:12px}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#e85d75}
.lamp{position:relative;width:16px;height:46px;flex:none}
.lamp::before{content:"";position:absolute;left:7px;top:14px;width:2px;height:30px;background:#3a404c}
.lamp::after{content:"";position:absolute;left:3px;bottom:0;width:10px;height:3px;border-radius:2px;background:#3a404c}
.lamp i{position:absolute;left:0;top:0;width:16px;height:14px;border-radius:8px 8px 2px 2px;background:#f2b230}
.house{position:relative}
.house .wall,.house .floor,.house .pcs{transition:box-shadow 1s}
.house.tod-night .wall,.house.tod-night .pcs{box-shadow:inset 0 0 0 999px rgba(10,14,40,.28)}
.house.tod-night .floor{box-shadow:inset 0 0 0 999px rgba(10,14,40,.35)}
.house.tod-evening .wall,.house.tod-evening .pcs{box-shadow:inset 0 0 0 999px rgba(255,140,60,.07)}
.house.tod-night .lamp i,.house.tod-evening .lamp i{box-shadow:0 6px 22px 8px rgba(255,200,90,.55);background:#ffd66b}
.house.tod-night .pc.on .scr{box-shadow:inset 0 0 14px color-mix(in srgb,var(--cc) 60%,transparent),0 0 16px color-mix(in srgb,var(--cc) 45%,transparent)}
.house.w-storm .win,.house.w-rain .win{border-color:#e9eef3}
.pot i{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(4deg)}}
.cat .tail{position:absolute;right:-9px;top:-3px;width:11px;height:3px;background:#3a404c;border-radius:2px;transform-origin:0 50%;animation:tail 1.8s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-35deg)}50%{transform:rotate(-5deg)}}
.cat .eye{position:absolute;left:-3px;top:-4px;width:2px;height:2px;border-radius:50%;background:#ffd257;box-shadow:4px 0 0 #ffd257;animation:blink 5s steps(1) infinite}
@keyframes blink{0%,94%{opacity:1}95%,100%{opacity:0}}
.mug{position:absolute;left:6px;bottom:10px;width:9px;height:9px;background:#e85d75;border-radius:0 0 3px 3px}
.mug::before{content:"";position:absolute;left:2px;bottom:10px;width:2px;height:7px;border-radius:2px;background:rgba(160,160,170,.6);animation:steam 2.4s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(3px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-5px) translateX(2px)}}
.slots{display:flex;gap:3px;align-items:center;justify-content:center}
.slots i{width:9px;height:9px;border-radius:2px;border:1.5px solid var(--line);background:var(--panel)}
.slots i.f{background:var(--cc);border-color:color-mix(in srgb,var(--cc) 70%,#000)}
.slots small{font:700 10px var(--f-num);color:var(--muted);margin-left:3px}
.pc .btn.exp{background:#7b4dff;color:#fff}
@media (prefers-reduced-motion:reduce){.pot i,.cat .tail,.cat .eye,.mug::before{animation:none}}
.poster{background:#12301f;color:#7ff0b0;font:800 13px var(--f-disp);padding:8px 10px;border-radius:6px;transform:rotate(-3deg);text-align:center;line-height:1.1}
.poster small{display:block;font:700 10px var(--f-num);color:#cfe;opacity:.8}
.shelf{display:flex;align-items:flex-end;gap:3px;border-bottom:5px solid #b98a5a;padding:0 4px;height:52px}
.book{width:8px;border-radius:2px 2px 0 0}.b1{height:26px;background:#e85d75}.b2{height:32px;background:#4f9fe0}.b3{height:22px;background:#f2b230}
.pot{width:20px;height:16px;background:#c9774a;border-radius:0 0 5px 5px;position:relative;margin-left:4px}
.pot i{position:absolute;left:3px;bottom:14px;width:14px;height:22px;background:#2fa66a;border-radius:50% 50% 40% 40%;box-shadow:-7px 6px 0 -3px #23915a,7px 5px 0 -3px #23915a}
.pcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:10px 10px 12px}
.pc{display:grid;justify-items:center;gap:4px;min-width:0;text-align:center}
.mon{width:100%;max-width:96px;aspect-ratio:4/3;background:#2a2f3a;border-radius:8px;padding:5px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mon::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:8px;margin-left:-5px;background:#2a2f3a}
.scr{width:100%;height:100%;border-radius:4px;background:#11161f;display:grid;place-items:center;overflow:hidden;position:relative}
.pc.on .scr{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--cc) 35%,#0b1510),#0b1510);box-shadow:inset 0 0 12px color-mix(in srgb,var(--cc) 40%,transparent)}
.scr b{font:800 12px var(--f-disp);color:var(--cc);text-shadow:0 0 8px var(--cc)}
.bars{position:absolute;left:6px;right:6px;bottom:5px;display:flex;gap:3px;align-items:flex-end;height:12px}
.bars i{flex:1;background:var(--cc);opacity:.8;border-radius:1px;animation:bar 1.1s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}.bars i:nth-child(4){animation-delay:.7s}
@keyframes bar{from{height:20%}to{height:100%}}
.plus{color:#6c7a72;font:700 22px var(--f-body)}
.lk{width:14px;height:11px;background:#6c7a72;border-radius:2px;position:relative;margin-top:6px}
.lk::before{content:"";position:absolute;left:2px;top:-8px;width:6px;height:7px;border:2px solid #6c7a72;border-bottom:0;border-radius:6px 6px 0 0}

.house2 .pc.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent),0 8px 24px -14px var(--cc)}
.pchead{position:relative;display:grid;place-items:center}
.pchead .lvl{right:-4px;top:-4px}
.pchead .lk{position:absolute;right:-2px;top:-2px;margin:0}
.house2 .pcname{font:800 12px var(--f-disp);margin-top:6px}
/* питомцы */
#petstage{display:block;width:100%;height:190px;border-radius:20px;cursor:pointer;touch-action:manipulation;box-shadow:0 16px 30px -18px rgba(255,79,216,.5)}
.petcard .petrow b{font:800 18px var(--f-disp)}
.petcard .nm{display:flex;gap:8px}
.petcard .nm input{flex:1;min-width:0;font:700 14px var(--f-body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.petbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.petbtns .btn{min-width:0;padding-inline:6px}
.toys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.toy{background:var(--panel);border:1px solid color-mix(in srgb,var(--fg) 8%,transparent);border-radius:18px;padding:10px;display:grid;gap:5px;justify-items:center;text-align:center}
.toy.on{border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.toy canvas{width:60px;height:48px}
.toy b{font-size:13px}.toy small{color:var(--muted);font-size:11px;line-height:1.35}
.toy .rar{color:var(--gold)}
.toy .btn{width:100%;min-width:0}
/* слоты */
.slotm{background:linear-gradient(160deg,#2a1450,#120a24);border:1px solid rgba(255,63,180,.35);border-radius:22px;padding:16px;display:grid;gap:12px;box-shadow:0 0 40px -14px rgba(255,63,180,.6);transition:box-shadow .3s}
.slotm.jack{box-shadow:0 0 60px 4px rgba(255,210,87,.7)}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reel3{height:84px;border-radius:14px;background:linear-gradient(#0a0714,#1d1238 50%,#0a0714);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 8px 14px rgba(0,0,0,.6),inset 0 -8px 14px rgba(0,0,0,.6)}

.slotmsg{text-align:center;font-size:13px;color:#cbbfe8;min-height:18px}
.slotmsg.win{color:#ffd257;font-weight:800;font-size:16px}.slotmsg.back{color:#2bffa3}
.paytab{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font:600 11px var(--f-num);color:#a993c9}
.paytab i{font-style:normal;margin-right:3px}

.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-bottom:10px}
.pod{background:var(--panel);border:1px solid color-mix(in srgb,var(--fg) 8%,transparent);border-radius:18px;padding:10px 6px;display:grid;justify-items:center;gap:4px;text-align:center;min-width:0}
.pod .av{width:44px;height:44px;font-size:24px}

.pod .medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800}
.pod.p1{padding-block:16px;box-shadow:0 0 30px -10px #e0a82e;border-color:rgba(224,168,46,.5)}
.pod.me{outline:2px solid var(--gold)}
</style>

/* ===== Слоты: один прокрут $500 =====
   Веса символов и выплаты подобраны так, что в среднем возвращается ~82% ставки: это развлечение, а не заработок. */
const SLOT_SYM=[['🍒',30,4],['◎',25,6],['Ξ',20,10],['₿',13,15],['💎',8,25],['7',4,50]];
const SPIN_COST=500;
function slotRoll(){const tot=SLOT_SYM.reduce((a,s)=>a+s[1],0);let r=Math.random()*tot;for(let i=0;i<SLOT_SYM.length;i++){if((r-=SLOT_SYM[i][1])<0)return i}return 0}
function slotsBlock(){return`<div class="sect">${t('slotsH')}</div><div class="slotm"><div class="reels">${[0,1,2].map(i=>`<div class="reel3"><span data-reel="${i}">${SLOT_SYM[(i*2)%6][0]}</span></div>`).join('')}</div>
  <div class="slotmsg" id="slotmsg">${t('slotsSub')}</div><button class="btn" id="spin" ${S.bal<SPIN_COST?'disabled':''}>${t('spin')}</button>
  <div class="paytab">${SLOT_SYM.slice().reverse().map(s=>`<span><i>${s[0]}${s[0]}${s[0]}</i>×${s[2]}</span>`).join('')}</div></div>`}
function bindSlots(m){const b=m.querySelector('#spin');if(!b)return;b.onclick=()=>{if(S.bal<SPIN_COST||b.dataset.busy)return;b.dataset.busy=1;b.disabled=true;S.bal-=SPIN_COST;save();refresh();unlockAudio();
  const res=[slotRoll(),slotRoll(),slotRoll()],els=[0,1,2].map(i=>m.querySelector(`[data-reel="${i}"]`)),msg=m.querySelector('#slotmsg');msg.textContent='…';msg.className='slotmsg';
  els.forEach((el,i)=>{el.parentElement.classList.add('spin');let n=0;const iv=setInterval(()=>{el.textContent=SLOT_SYM[(n++ +i*2)%6][0];if(n%2)tone(500+i*90,.03,{type:'sine',vol:.04})},70);
    setTimeout(()=>{clearInterval(iv);el.textContent=SLOT_SYM[res[i]][0];el.parentElement.classList.remove('spin');sfx('tap');
      if(i===2){const [a,c,d]=res;let win=0;if(a===c&&c===d)win=SPIN_COST*SLOT_SYM[a][2];else if(a===c||c===d||a===d)win=SPIN_COST;
        if(win){earn(win);save();refresh()}
        msg.textContent=win>SPIN_COST?t('slotWin',{v:money(win)}):win?t('slotBack'):t('slotLose');msg.className='slotmsg '+(win>SPIN_COST?'win':win?'back':'');
        if(win>SPIN_COST){sfx('record');haptic('success');m.querySelector('.slotm').classList.add('jack');setTimeout(()=>m.querySelector('.slotm')?.classList.remove('jack'),1500)}else if(win)sfx('buy');
        delete b.dataset.busy;b.disabled=S.bal<SPIN_COST;checkAch()}},700+i*450)})}}

/* ===== Персонаж =====
   Объёмный кубик: видны передняя, верхняя и боковая грани, блик и тень снизу. Глаза моргают и смотрят
   по ходу движения, в прыжке кубик тянется, ручки поднимаются. Ступни на y=+14 (по ним считается касание платформ). */
function rrect(x,X,Y,w,h,r){x.beginPath();if(x.roundRect){x.roundRect(X,Y,w,h,r)}else{x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}}
function shade(c,p){let h=String(c).replace('#','');if(h.length===3)h=h.split('').map(v=>v+v).join('');const n=parseInt(h,16)||0,f=v=>Math.round(p<0?v*(1+p):v+(255-v)*p);return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function hgrad(x,x0,x1,c){const g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,shade(c,.3));g.addColorStop(.45,c);g.addColorStop(1,shade(c,-.45));return g}
function vgrad(x,y0,y1,c){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,shade(c,.35));g.addColorStop(.5,c);g.addColorStop(1,shade(c,-.4));return g}
function ball(x,cx,cy,r,c){const g=x.createRadialGradient(cx-r*.35,cy-r*.4,r*.1,cx,cy,r*1.1);g.addColorStop(0,shade(c,.45));g.addColorStop(.55,c);g.addColorStop(1,shade(c,-.45));return g}
// материал кубика: обычный пластик, металл (золото) или кристалл
const HERO_MAT={gold:'metal',diamond:'crystal',cold:'frost'};
function sparkle(x,a,b,r){x.beginPath();x.moveTo(a,b-r);x.lineTo(a+r*.25,b-r*.25);x.lineTo(a+r,b);x.lineTo(a+r*.25,b+r*.25);x.lineTo(a,b+r);x.lineTo(a-r*.25,b+r*.25);x.lineTo(a-r,b);x.lineTo(a-r*.25,b-r*.25);x.closePath();x.fill()}
function drawHero(x,cx,cy,sk,s=1,pose={}){
  const vy=pose.vy||0,vx=pose.vx||0,tt=pose.t||0,mat=HERO_MAT[sk.k]||'plastic',c=sk.body,k=sk.acc;
  const up=Math.max(-1,Math.min(1,-vy/8)),dir=vx>.3?1:vx<-.3?-1:0;
  const st=1+Math.abs(up)*.07,sq=1/st; // тянется в полёте
  x.save();x.translate(cx,cy+14);x.scale(s*sq,s*st);x.rotate(Math.max(-.18,Math.min(.18,vx*.05)));x.translate(0,-14);x.lineCap='round';x.lineJoin='round';
  const S0=13,D=5; // полуразмер передней грани и глубина куба
  // ножки
  const fy=14-up*1.5;
  for(const sx of[-6,6]){x.fillStyle=vgrad(x,fy-3,fy+2,shade(c,-.55));rrect(x,sx-4,fy-3,8,5,2.5);x.fill()}
  // ручки: в полёте вверх
  const ay=2-up*8;
  for(const sx of[-1,1]){x.fillStyle=ball(x,sx*(S0+3),ay,3.4,shade(c,-.1));x.beginPath();x.ellipse(sx*(S0+3),ay,3.2,3.6,0,0,7);x.fill()}
  // боковая и верхняя грани
  x.fillStyle=shade(c,-.42);x.beginPath();x.moveTo(S0,-S0+2);x.lineTo(S0+D,-S0-D+3);x.lineTo(S0+D,S0-D);x.lineTo(S0,S0);x.closePath();x.fill();
  x.fillStyle=shade(c,.28);x.beginPath();x.moveTo(-S0+2,-S0);x.lineTo(-S0+D+2,-S0-D);x.lineTo(S0+D-1,-S0-D);x.lineTo(S0,-S0);x.closePath();x.fill();
  // передняя грань
  const fg=x.createLinearGradient(-S0,-S0,S0,S0);
  if(mat==='metal'){fg.addColorStop(0,'#fff4c2');fg.addColorStop(.35,c);fg.addColorStop(.6,shade(c,-.25));fg.addColorStop(.8,shade(c,.2));fg.addColorStop(1,shade(c,-.45))}
  else if(mat==='crystal'){fg.addColorStop(0,'rgba(255,255,255,.95)');fg.addColorStop(.5,c);fg.addColorStop(1,shade(c,-.35))}
  else{fg.addColorStop(0,shade(c,.22));fg.addColorStop(.55,c);fg.addColorStop(1,shade(c,-.3))}
  x.fillStyle=fg;rrect(x,-S0,-S0,S0*2,S0*2,6);x.fill();
  // фаска и блики
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1;rrect(x,-S0+.8,-S0+.8,S0*2-1.6,S0*2-1.6,5.5);x.stroke();
  const ao=x.createLinearGradient(0,S0-8,0,S0);ao.addColorStop(0,'rgba(0,0,0,0)');ao.addColorStop(1,'rgba(0,0,0,.22)');x.fillStyle=ao;rrect(x,-S0,-S0,S0*2,S0*2,6);x.fill();
  x.fillStyle='rgba(255,255,255,.45)';x.beginPath();x.ellipse(-S0+6,-S0+5,4.5,2.2,-.5,0,7);x.fill();
  if(mat==='crystal'){x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=.6;x.beginPath();x.moveTo(-S0,-2);x.lineTo(-4,-S0);x.moveTo(S0,4);x.lineTo(3,S0);x.moveTo(-6,S0);x.lineTo(S0,-6);x.stroke()}
  if(mat==='frost'){x.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<6;i++){x.beginPath();x.arc(-10+i*4,-S0+1.5+(i%2),1.6,0,7);x.fill()}}
  // глаза: склера, радужка, зрачок, блик; моргают
  const ex=5.2,ey=-4,lk=dir*1.2,blink=(tt%220)<5;
  if(k==='laser'){x.save();x.shadowColor='#ff2a2a';x.shadowBlur=8;x.fillStyle='#ff3b3b';x.beginPath();x.ellipse(-ex,ey,3,2.2,0,0,7);x.ellipse(ex,ey,3,2.2,0,0,7);x.fill();x.restore();
    const lg=x.createLinearGradient(0,ey,24,ey+10);lg.addColorStop(0,'rgba(255,60,60,.95)');lg.addColorStop(1,'rgba(255,60,60,0)');x.strokeStyle=lg;x.lineWidth=2;
    x.beginPath();x.moveTo(-ex,ey);x.lineTo(-26,ey+9);x.moveTo(ex,ey);x.lineTo(26,ey+9);x.stroke();
    x.fillStyle='#fff';x.beginPath();x.arc(-ex-.8,ey-.8,.8,0,7);x.arc(ex-.8,ey-.8,.8,0,7);x.fill()}
  else if(blink){x.strokeStyle=shade(c,-.6);x.lineWidth=1.3;x.beginPath();x.moveTo(-ex-3,ey);x.quadraticCurveTo(-ex,ey+1.4,-ex+3,ey);x.moveTo(ex-3,ey);x.quadraticCurveTo(ex,ey+1.4,ex+3,ey);x.stroke()}
  else{x.fillStyle='#fff';x.beginPath();x.ellipse(-ex,ey,3.6,4,0,0,7);x.ellipse(ex,ey,3.6,4,0,0,7);x.fill();
    x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=.6;x.stroke();
    const iy=ey+.6+(up<-.3?1:up>.3?-1:0);
    x.fillStyle=ball(x,-ex+lk,iy,2.4,sk.eye==='#123'?'#2b6cb0':sk.eye);x.beginPath();x.arc(-ex+lk,iy,2.3,0,7);x.arc(ex+lk,iy,2.3,0,7);x.fill();
    x.fillStyle='#0a0a0a';x.beginPath();x.arc(-ex+lk,iy,1.1,0,7);x.arc(ex+lk,iy,1.1,0,7);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(-ex+lk-.9,iy-1,.75,0,7);x.arc(ex+lk-.9,iy-1,.75,0,7);x.fill()}
  // брови, щёчки, рот
  x.strokeStyle=shade(c,-.6);x.lineWidth=1.1;x.beginPath();x.moveTo(-ex-2.5,ey-5.6-up*.8);x.lineTo(-ex+2,ey-6.2-up*.8);x.moveTo(ex-2,ey-6.2-up*.8);x.lineTo(ex+2.5,ey-5.6-up*.8);x.stroke();
  x.fillStyle='rgba(255,110,130,.28)';x.beginPath();x.ellipse(-ex-1.5,ey+5.5,2.4,1.4,0,0,7);x.ellipse(ex+1.5,ey+5.5,2.4,1.4,0,0,7);x.fill();
  if(up>.4){x.fillStyle='#3a1414';x.beginPath();x.ellipse(lk*.5,ey+7.5,2.2,1.8,0,0,7);x.fill();x.fillStyle='#ff7a8a';x.beginPath();x.ellipse(lk*.5,ey+8.4,1.4,.8,0,0,7);x.fill()}
  else{x.strokeStyle='#3a1414';x.lineWidth=1.2;x.beginPath();x.moveTo(-2.5+lk*.5,ey+7);x.quadraticCurveTo(lk*.5,ey+9.2,2.5+lk*.5,ey+7);x.stroke()}
  // гравировка ₿
  x.font='bold 7px JetBrains Mono, monospace';x.textAlign='center';x.fillStyle='rgba(0,0,0,.22)';x.fillText('₿',0,S0-2);x.fillStyle='rgba(255,255,255,.25)';x.fillText('₿',-.5,S0-2.5);
  // аксессуары
  const top=-S0-D;
  if(k==='spout'){for(let i=0;i<4;i++){const ph=(tt*.05+i*.25)%1,yy=top-2-ph*14,xx=Math.sin(i*2)*5*ph;x.globalAlpha=1-ph;x.fillStyle=ball(x,xx,yy,2.4,'#7fd3ff');x.beginPath();x.arc(xx,yy,2.4-ph,0,7);x.fill()}x.globalAlpha=1;
    x.fillStyle=ball(x,0,top+1,3,'#5cbcff');x.beginPath();x.ellipse(0,top+1,3.2,1.6,0,0,7);x.fill()}
  if(k==='hat'){x.fillStyle=ball(x,0,top-3,10,'#d8323f');x.beginPath();x.moveTo(-S0+1,top+3);x.bezierCurveTo(-S0+1,top-12,S0+3,top-12,S0+3,top+3);x.fill();
    x.strokeStyle='rgba(0,0,0,.15)';x.lineWidth=.7;for(let i=-9;i<=11;i+=3){x.beginPath();x.moveTo(i,top+2);x.lineTo(i*.6+1,top-6);x.stroke()}
    x.fillStyle=vgrad(x,top,top+5,'#eef3f6');rrect(x,-S0,top,S0*2+4,5,2.5);x.fill();x.fillStyle=ball(x,1,top-11,3.6,'#ffffff');x.beginPath();x.arc(1,top-11,3.6,0,7);x.fill()}

    for(let r=0;r<3;r++){x.beginPath();x.moveTo(0,H);for(let xx=0;xx<=W;xx+=10)x.lineTo(xx,H-40+r*14+Math.sin(xx*.04+tt*.05+r)*5);x.lineTo(W,H);x.fillStyle=['rgba(15,143,201,.25)','rgba(15,143,201,.35)','rgba(10,110,170,.45)'][r];x.fill()}}

/* ===== Игра «Прыжок» ===== */
let G=null,raf=0,keysOff=null;
function setHeader(c){try{window.Telegram?.WebApp?.setHeaderColor?.(c)}catch(e){}}
function stopGame(){if(G)musicMode('app');cancelAnimationFrame(raf);G=null;if(keysOff){keysOff();keysOff=null}gameChrome(null)}
function hudTheme(m,z){m.style.setProperty('--hudfg',z.dark?'#ffffff':'#12301f');m.style.setProperty('--hudmut',z.dark?'rgba(255,255,255,.7)':'#5f7b69')}
function startGame(m){
  const z=startZone();
  m.innerHTML=`<canvas id="cv"></canvas><div class="hud"><div><small>${t('score')}</small><b id="sc">0</b></div><div style="text-align:right"><small>${t('coinsRec',{r:S.record})}</small><b id="cc">$0</b></div></div>
  <div class="overlay" id="ov"><div class="ov"><h3>${t('title')}</h3>${runChips()}<p>${t('howto')}</p>
  <div class="legend"><span><i class="lg x2">2×</i>${t('it_x2')}</span><span><i class="lg heli"></i>${t('it_heli')}</span><span><i class="lg tramp">2×</i>${t('it_tramp')}</span><span><i class="lg box"></i>${t('it_box')}</span></div>
  <div class="kv"><span>${t('bgStart')}</span><b>${L(z.n)}</b></div>
  <div class="kv"><span>${t('record')}</span><b>${S.record}</b></div><div class="kv"><span>${t('recBonus')}</span><b>×${recMul().toFixed(2)}</b></div>
  <button class="btn" id="go">${t('play')}</button></div></div>`;
  hudTheme(m,z);
  requestAnimationFrame(()=>{const cv=$('#cv');if(!cv)return;const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);drawZone(x,W,H,z,0,0)});
  $('#go').onclick=play;
}
function play(){
  stopGame();musicMode('game');
  const m=$('#screen'),ov=$('#ov');ov.hidden=true;ov.style.display='none';
  const cv=$('#cv'),x=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const sk=SKINS.find(s=>s.k===S.skin)||SKINS[0];
  const use=k=>{if((S.runs[k]||0)>0){S.runs[k]--;return true}return false};
  const bCoins=use('coins2x'),bSuper=use('super'),bRocket=use('rocket'),bShield=use('shield');save();
  const jumpV=-(8.5*(1+upgLvl('jump')*.06))*(bSuper?1.25:1),coinVal=.5*(1+upgLvl('value')*.25)*(bCoins?2:1)*(S.perks.vip?2:1),mag=40+upgLvl('magnet')*18+(bCoins?30:0);
  const startZ=bgIdx(),leg=curLeg();

function drawCat(x,cx,by,dir,state,tt,col='#3a404c'){

}

    v=Math.round(v);return{icon:'$',col:'#14a053',title:money(v),desc:t('rw_cash'),apply:()=>earn(v)}}
  if(k==='hero'||k==='hero2'){const n=k==='hero2'?2:1,pool=UPG.filter(u=>upgLvl(u.k)<u.max);
    if(!pool.length)return rewardFor(b,'cash',streak);const u=pool[Math.floor(Math.random()*pool.length)],add=Math.min(n,u.max-upgLvl(u.k));

    const c=pool[Math.floor(Math.random()*pool.length)];return{icon:'▣',col:c.col,title:c.sym+' +1 '+t('lvl'),desc:t('rw_pc'),apply:()=>{S.cards[c.sym]=cardLvl(c)+1}}}
  const B=BUFFS[k];return{icon:'⚡',col:'#d1901a',title:L(B.n),desc:L(B.d),apply:()=>applyBuff(k)}

function checkAch(){
  let got=[];
  for(const a of ACH)if(!S.ach[a.k]&&a.t()){S.ach[a.k]=Date.now();earn(a.r);got.push(a)}

}

function defaultName(){try{const u=window.Telegram?.WebApp?.initDataUnsafe?.user;if(u)return(u.username||u.first_name||'').slice(0,18)}catch(e){}return t('miner')+'-'+S.pid.slice(1,5).toUpperCase()}
if(!S.name)S.name=defaultName();
const AVATARS=['🚀','🐋','🦊','🐸','🐱','🐶','🤖','👾','💎','🔥','🦁','🐼','🐻','🦄','👽','😎','⛏️','🌙'];
const myAvatar=()=>(!S.avatar||S.avatar==='hero')?'h:'+S.skin:S.avatar;
function avHTML(a,cls){a=a||'h:satoshi';if(a.startsWith('h:'))return`<canvas class="${cls}" width="64" height="64" data-av="${a.slice(2).replace(/[^a-z]/g,'')}"></canvas>`;return`<span class="${cls}" data-emo></span>`}
function paintAv(root,rows){root.querySelectorAll('canvas[data-av]').forEach(cv=>{const x=cv.getContext('2d');const sk=SKINS.find(s=>s.k===cv.dataset.av)||SKINS[0];x.scale(cv.width/64,cv.width/64);drawHero(x,32,36,sk,1.25)})}
const playerCard=()=>({lang:LANG,avatar:myAvatar(),name:S.name,record:S.record,earned:Math.round(S.earned),cards:Object.keys(S.cards).length,skin:S.skin,ach:Object.keys(S.ach).length,ts:Date.now()});

/* ===== Рейтинг =====
   1) в Telegram с сервером (server.js): /api/top и /api/score
   2) в превью Claude: общая база артефакта
   3) иначе: только локальный результат */
const LB={mode:'local',rows:[],me:null,db:null,last:'',
  async init(){
    // сервер на бесплатном хостинге может просыпаться до минуты — пробуем несколько раз
    for(let i=0;i<4;i++){
      try{const r=await fetch('api/top',{cache:'no-store'});if(r.ok&&(r.headers.get('content-type')||'').includes('json')){this.mode='server';const jj=await r.json();this.rows=jj.players||[];if(jj.bot)S.bot=jj.bot;if(tab==='profile')render();
        await this.push(true);setInterval(()=>this.pull(),30000);setInterval(()=>this.push(true),300000);return}
        if(r.status===404)break}catch(e){}
      await new Promise(r=>setTimeout(r,5000));
    }
    try{
      if(window.claude?.use){const db=await claude.use('db'),user=await claude.use('user');
        if(db&&user){const id=await user.id();if(id){this.db=db;this.me=id;this.mode='claude';
          db.collection('players').orderBy('record','desc').limit(200).onSnapshot(q=>{this.rows=q.docs.map(d=>({id:d.id,...d.data()}));if(tab==='profile')render()},()=>{});
          this.push(true);return}}}
    }catch(e){}
  },
  async pull(){if(this.mode!=='server')return;await this.push();try{const r=await fetch('api/top',{cache:'no-store'});this.rows=(await r.json()).players||[];if(tab==='profile')render()}catch(e){}},
  async push(force){
    if(this.mode==='local')return;
    const sig=JSON.stringify({...playerCard(),ts:0});if(!force&&sig===this.last)return;this.last=sig;
    try{
      if(this.mode==='claude')await this.db.collection('players').doc(this.me).set(playerCard());
      if(this.mode==='server'){const r=await fetch('api/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:window.Telegram?.WebApp?.initData||'',pid:S.pid,...playerCard()})});const j=await r.json();if(j.players){this.rows=j.players;this.me=j.me}if(tab==='profile')render()}
    }catch(e){}
  },
  list(){
    if(this.mode==='local')return[{id:'me',...playerCard(),isMe:true}];
    const rows=this.rows.map(r=>({...r,isMe:r.id===this.me}));
    if(!rows.some(r=>r.isMe))rows.push({id:this.me,...playerCard(),isMe:true});
    return rows.sort((a,b)=>b.record-a.record||b.earned-a.earned);
  }
};

function langSwitch(){return`<div class="langs" role="group" aria-label="${t('lang')}">${[['ru','RU'],['uk','UA'],['en','EN']].map(([k,l])=>`<button data-lang="${k}" class="${LANG===k?'on':''}">${l}</button>`).join('')}</div>`}
function bindLang(root){root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang))}
function setLang(k){LANG=k;S.lang=k;save();applyStatic();refresh();loadPrices();render();const w=$('.welcome');if(w)showWelcome(w)}

    <div class="stat"><small>${t('recBonus')}</small><b>×${recMul().toFixed(2)}</b></div>
    <div class="stat"><small>${t('achs')}</small><b>${achN}/${ACH.length}</b></div>
  </div>
  <div class="sect">${t('cardsOf',{a:owned,b:COINS.length})}</div>
  <div class="prog">${COINS.map(c=>`<div class="prow"><span><b>${c.sym}</b></span><div class="bar"><i style="width:${Math.min(cardLvl(c)/10,1)*100}%"></i></div><span>${cardLvl(c)?t('lvl')+' '+cardLvl(c):'—'}</span></div>`).join('')}</div>
  <div class="sect">${t('heroOf',{a:Object.keys(S.skins).length,b:SKINS.length})}</div>
  <div class="prog">${UPG.map(u=>`<div class="prow"><span style="font-size:12px">${L(u.name)}</span><div class="bar"><i style="width:${upgLvl(u.k)/u.max*100}%"></i></div><span>${upgLvl(u.k)}/${u.max}</span></div>`).join('')}</div>
  <div class="sect">${t('achs')}</div>
  <div class="achs">${ACH.map(a=>`<div class="ach ${S.ach[a.k]?'on':'off'}"><b>${S.ach[a.k]?'✓ ':''}${L(a.n)}</b><small>${L(a.d)}</small><span class="rw">+${money(a.r)}</span></div>`).join('')}</div>`;
  $('#pname').value=S.name;
  rows.slice(0,200).forEach((r,i)=>{const el=m.querySelector(`[data-nm="${i}"]`)||m.querySelector(`[data-pod="${i}"]`);if(el)el.textContent=(r.name||t('player'))+(r.isMe?' '+t('you'):'')});

  paintAv(m);
  m.querySelectorAll('[data-avpick]').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.avpick;save();LB.push();render()});
  bindLang(m);bindRef(m);bindSound(m);bindTheme(m);
  $('#psave').onclick=()=>{const v=$('#pname').value.trim().replace(/\s+/g,' ').slice(0,18);if(v.length<2){toast(t('nameShort'));return}S.name=v;save();LB.push();toast(t('nameSaved'));render()};
  $('#pname').onkeydown=e=>{if(e.key==='Enter')$('#psave').click()};
}

const DEFAULT_BOT='MiningJump_bot'; // имя бота на случай, если сервер ещё не ответил
function refLink(){const tid=S.refId||(()=>{try{const u=window.Telegram?.WebApp?.initDataUnsafe?.user;return u?'tg'+u.id:''}catch(e){return''}})();const bot=S.bot||DEFAULT_BOT;return(bot&&tid)?`https://t.me/${bot}?start=ref_${tid}`:''}
function refBlock(){const link=refLink();return`<div class="ref"><div class="big">+$200</div><p class="sub" style="margin:0">${t('refSub',{v:'$200'})}</p>
  ${link?`<div class="reflink"><input id="reflink" readonly aria-label="${t('refH')}"></div><div class="refbtns"><button class="btn ghost" id="refcopy">${t('copy')}</button><button class="btn" id="refshare">${t('share')}</button></div>`:`<p class="note" style="margin:0">${t('refNo')}</p>`}
  <div class="kv"><span>${t('refCount',{n:''}).replace(/[:\s]+$/,'')}</span><b>${S.refCount||0}</b></div></div>`}
function bindRef(m){const link=refLink(),inp=m.querySelector('#reflink');if(!inp)return;inp.value=link;
  m.querySelector('#refcopy').onclick=()=>{const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(link).then(done,()=>{inp.select();document.execCommand('copy');done()})}catch(e){inp.select();try{document.execCommand('copy')}catch(_){}done()}};
  m.querySelector('#refshare').onclick=()=>{const u='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t('shareText'));const tg=window.Telegram?.WebApp;if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click()}}}
function showWelcome(d){
  d.innerHTML=`<div class="ov"><h3>${t('title')}</h3><div style="display:flex;justify-content:center">${langSwitch()}</div><div class="big">+$1000</div><p>${t('welcome')}${t('newbieW')}</p><button class="btn" id="wok">${t('start')}</button></div>`;
  bindLang(d);$('#wok').onclick=()=>d.remove();
}
