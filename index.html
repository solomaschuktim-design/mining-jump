<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Майнинг Прыжок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: one-screen app — top balance bar, swappable screen, bottom tab bar (Telegram Mini App shape) */
:root{
  --ink:#f2f8f3; --panel:#ffffff; --panel2:#e4f1e8; --line:#d2e5d8;
  --fg:#12301f; --muted:#5f7b69; --gold:#1d9e57; --gold-d:#157a42;
  --up:#14a053; --down:#d94848; --r-common:#5f9e74; --r-rare:#3f8fd6; --r-legend:#d1901a; --star:#f2a900; --sky1:#e9f7ee; --sky2:#c6ead3;
  --f-disp:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bal small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.bal b{font-family:var(--f-num);font-size:26px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.rate{text-align:right;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.rate b{color:var(--up);font-size:14px;display:block}
.ticker{overflow:hidden;border-block:1px solid var(--line);background:var(--panel);white-space:nowrap;font-family:var(--f-num);font-size:12px}
.ticker-in{display:inline-flex;gap:22px;padding:7px 0;animation:tick 28s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-in{animation:none}}
.tk{display:inline-flex;gap:6px}.tk i{font-style:normal;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
main{flex:1;min-height:0;overflow-y:auto;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.game{padding:0;overflow:hidden;position:relative}
h2{font-family:var(--f-disp);font-size:18px;font-weight:800;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;line-height:1.45}
.stack{display:grid;gap:10px}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.locked{opacity:.45}
.chip{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-size:12px;font-weight:800;color:#0d0e19;position:relative;overflow:hidden}
.chip::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.12) 6px 7px)}
.chip span{position:relative;z-index:1}
.chip.acc{background:var(--gold);color:#fff}
.card,.price-row,.skin,.claim{box-shadow:0 1px 2px rgba(18,48,31,.06)}
.meta{min-width:0}
.meta b{font-size:15px;display:block}
.meta .l{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.meta .inc{font-family:var(--f-num);font-size:12px;color:var(--up)}
.btn{font:700 13px var(--f-body);border:0;border-radius:10px;padding:10px 12px;background:var(--gold);color:#fff;cursor:pointer;min-width:84px;font-variant-numeric:tabular-nums}
.btn:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--panel2);color:var(--fg)}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.claim{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#dff3e6,#ffffff);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.claim .v{font-family:var(--f-num);font-size:20px;color:var(--gold);font-weight:700}
.claim small{color:var(--muted);display:block;font-size:12px}
.sect{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.skin{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;justify-items:center;text-align:center}
.skin.on{border-color:var(--gold)}
.skin canvas{width:64px;height:64px}
.skin b{font-size:13px}
.price-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.price-row .p{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.price-row .p b{display:block;font-size:15px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:var(--muted);font:700 10px var(--f-body);padding:9px 0 10px;display:grid;justify-items:center;gap:3px;cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--gold)}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;font-family:var(--f-num);pointer-events:none}
.hud b{font-size:22px;color:var(--hudfg,var(--fg))}.hud small{color:var(--hudmut,var(--muted));display:block;font-size:11px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,48,31,.35);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.ov{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(340px,100%);text-align:center;display:grid;gap:10px}
.ov h3{font-family:var(--f-disp);font-size:22px;margin:0}
.ov .big{font-family:var(--f-num);font-size:30px;color:var(--gold);font-weight:700}
.ov p{margin:0;color:var(--muted);line-height:1.45}
.kv{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:13px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--gold);color:#fff;font-weight:700;padding:10px 16px;border-radius:12px;z-index:20;transition:opacity .3s}
.welcome h3{font-size:20px}
.prof{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.prof canvas{width:72px;height:72px;background:var(--panel2);border-radius:14px}
.prof .nm{display:flex;gap:8px;min-width:0}
.prof input{flex:1;min-width:0;font:700 16px var(--f-body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.prof input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.prof .rk{font-size:12px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.prog{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.prow .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.prow .bar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.prow span:last-child{text-align:right;font-family:var(--f-num);color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:3px}
.ach b{font-size:13px}.ach small{color:var(--muted);font-size:12px;line-height:1.35}
.ach .rw{font-family:var(--f-num);font-size:12px;color:var(--gold)}
.ach.off{opacity:.5}.ach.on{border-color:var(--gold);background:linear-gradient(135deg,#e6f6ec,#ffffff)}
.lb{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lr{display:grid;grid-template-columns:30px 28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.lr:first-child{border-top:0}
.lr .n{font-family:var(--f-num);color:var(--muted);text-align:center}
.lr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lr .sc{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.lr .sc small{display:block;color:var(--muted);font-size:11px}
.lr.me{background:var(--panel2)}
.lr .medal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.bchip{font:700 12px var(--f-num);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--fg)}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;gap:8px;justify-items:center;text-align:center;min-width:0}
.case .box{width:54px;height:46px;border-radius:9px;position:relative;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.case .box::before{content:"";position:absolute;left:0;right:0;top:14px;height:6px;background:rgba(255,255,255,.55)}
.case .box::after{content:"";position:absolute;left:22px;top:9px;width:10px;height:16px;border-radius:3px;background:#fff;opacity:.85}
.case b{font-size:13px}.case small{color:var(--muted);font-size:11px;line-height:1.3}
.case .btn{min-width:0;width:100%;padding-inline:6px}
.rar{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.chip.star{background:var(--star);color:#fff;font-size:18px}
.btn.star{background:var(--star);color:#fff}
.reel{font-family:var(--f-disp);font-size:18px;min-height:52px;display:grid;place-items:center;text-wrap:balance}
.langs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.langs button{font:700 12px var(--f-body);border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.langs button.on{background:var(--panel);color:var(--gold);box-shadow:0 1px 2px rgba(18,48,31,.12)}
.langs button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.av{width:28px;height:28px;border-radius:50%;background:var(--panel2);display:inline-grid;place-items:center;font-size:16px;line-height:1;overflow:hidden}
.bigav{width:72px;height:72px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-size:40px;line-height:1}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.avs button{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;background:var(--panel);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;min-width:0}
.avs button.on{border-color:var(--gold);background:var(--panel2)}
.avs button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.avs canvas{width:32px;height:32px}
.house{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(#e8f3ea,#dcebdf);box-shadow:0 1px 2px rgba(18,48,31,.06)}
.wall{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 14px 6px;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(18,48,31,.035) 38px 40px)}
.win{width:76px;height:56px;border:4px solid #fff;border-radius:8px;position:relative;background:linear-gradient(#8fd3ff,#d9f2ff);box-shadow:0 2px 0 rgba(18,48,31,.12);overflow:hidden}
.win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff}
.win::after{content:"";position:absolute;top:50%;left:0;right:0;height:4px;margin-top:-2px;background:#fff}
.win i{position:absolute;right:8px;top:6px;width:14px;height:14px;border-radius:50%;background:#fff3a0}
.win.night{background:linear-gradient(#0f1633,#2b3566)}.win.night i{background:#f4f1d0;box-shadow:-30px 20px 0 -6px #fff,-44px 6px 0 -6px #fff}
.poster{background:#12301f;color:#7ff0b0;font:800 13px var(--f-disp);padding:8px 10px;border-radius:6px;transform:rotate(-3deg);text-align:center;line-height:1.1}
.poster small{display:block;font:700 10px var(--f-num);color:#cfe;opacity:.8}
.shelf{display:flex;align-items:flex-end;gap:3px;border-bottom:5px solid #b98a5a;padding:0 4px;height:52px}
.book{width:8px;border-radius:2px 2px 0 0}.b1{height:26px;background:#e85d75}.b2{height:32px;background:#4f9fe0}.b3{height:22px;background:#f2b230}
.pot{width:20px;height:16px;background:#c9774a;border-radius:0 0 5px 5px;position:relative;margin-left:4px}
.pot i{position:absolute;left:3px;bottom:14px;width:14px;height:22px;background:#2fa66a;border-radius:50% 50% 40% 40%;box-shadow:-7px 6px 0 -3px #23915a,7px 5px 0 -3px #23915a}
.pcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:10px 10px 12px}
.pc{display:grid;justify-items:center;gap:4px;min-width:0;text-align:center}
.mon{width:100%;max-width:96px;aspect-ratio:4/3;background:#2a2f3a;border-radius:8px;padding:5px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mon::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:8px;margin-left:-5px;background:#2a2f3a}
.scr{width:100%;height:100%;border-radius:4px;background:#11161f;display:grid;place-items:center;overflow:hidden;position:relative}
.pc.on .scr{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--cc) 35%,#0b1510),#0b1510);box-shadow:inset 0 0 12px color-mix(in srgb,var(--cc) 40%,transparent)}
.scr b{font:800 12px var(--f-disp);color:var(--cc);text-shadow:0 0 8px var(--cc)}
.bars{position:absolute;left:6px;right:6px;bottom:5px;display:flex;gap:3px;align-items:flex-end;height:12px}
.bars i{flex:1;background:var(--cc);opacity:.8;border-radius:1px;animation:bar 1.1s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.45s}.bars i:nth-child(4){animation-delay:.7s}
@keyframes bar{from{height:20%}to{height:100%}}
.plus{color:#6c7a72;font:700 22px var(--f-body)}
.lk{width:14px;height:11px;background:#6c7a72;border-radius:2px;position:relative;margin-top:6px}
.lk::before{content:"";position:absolute;left:2px;top:-8px;width:6px;height:7px;border:2px solid #6c7a72;border-bottom:0;border-radius:6px 6px 0 0}
.lvl{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#fff;font:700 11px var(--f-num);display:grid;place-items:center;padding:0 4px}
.desk{width:100%;height:10px;background:#b98a5a;border-radius:3px;margin-top:6px;position:relative;box-shadow:0 3px 0 #9a6f45}
.tower{position:absolute;right:4px;bottom:10px;width:12px;height:20px;background:#3a404c;border-radius:2px}
.tower i{position:absolute;left:3px;top:4px;width:5px;height:3px;border-radius:2px;background:#555}
.pc.on .tower i{background:var(--cc);animation:led 1.4s steps(2) infinite}
@keyframes led{50%{opacity:.25}}
.pc.locked{opacity:.55}
.pcname{font:800 12px var(--f-disp);margin-top:4px}
.pcinc{font:600 11px var(--f-num);color:var(--up);min-height:14px;overflow-wrap:anywhere}
.pc.locked .pcinc{color:var(--muted)}
.pc .btn{min-width:0;width:100%;font-size:11px;padding:8px 4px;line-height:1.2}
.floor{height:30px;background:repeating-linear-gradient(90deg,#c99b6a 0 46px,#bf9060 46px 48px);position:relative;border-top:3px solid #a97c4f}
.rug{position:absolute;left:30%;right:30%;top:7px;height:14px;border-radius:50%;background:#1d9e57;opacity:.55}
.cat{position:absolute;right:16px;bottom:8px;width:22px;height:12px;background:#3a404c;border-radius:10px 10px 4px 4px}
.cat::before{content:"";position:absolute;left:-6px;top:-7px;width:12px;height:11px;background:#3a404c;border-radius:50%;clip-path:polygon(0 30%,20% 0,40% 25%,60% 25%,80% 0,100% 30%,100% 100%,0 100%)}
.cat::after{content:"";position:absolute;right:-8px;top:-2px;width:10px;height:3px;background:#3a404c;border-radius:2px;transform:rotate(-30deg)}
@media (prefers-reduced-motion:reduce){.bars i,.pc.on .tower i{animation:none}}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bgt{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:6px;min-width:0}
.bgt.on{border-color:var(--gold)}.bgt.off canvas{filter:grayscale(.8) brightness(.8)}
.bgt canvas{width:100%;aspect-ratio:16/10;border-radius:9px;display:block}
.bgt b{font-size:13px;padding-inline:2px}.bgt small{font:600 11px var(--f-num);color:var(--muted);padding-inline:2px}
.bgt .btn{min-width:0;width:100%;padding:8px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:700 9px var(--f-num);color:#fff;font-style:normal}
.lg.x2{background:#7b4dff}.lg.heli{background:#0f8fc9}.lg.tramp{background:#ff5a5a;border-radius:5px}
.ref{background:linear-gradient(135deg,#e6f6ec,#ffffff);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.ref .big{font:800 22px var(--f-num);color:var(--gold)}
.reflink{display:flex;gap:8px;min-width:0}
.reflink input{flex:1;min-width:0;font:600 12px var(--f-num);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.refbtns{display:flex;gap:8px}.refbtns .btn{flex:1}
.tab.dot::after{content:"";position:absolute;top:7px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#ff5a5a;box-shadow:0 0 0 2px var(--panel)}
.crate{width:64px;height:52px;position:relative;margin:6px auto 0;flex:none}
.crate::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;border-radius:6px;background:repeating-linear-gradient(0deg,var(--bc) 0 11px,rgba(0,0,0,.12) 11px 12px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.crate .lid{position:absolute;left:-3px;right:-3px;top:2px;height:16px;border-radius:5px;background:var(--bl);transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:10% 100%;z-index:2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.crate .band{position:absolute;left:50%;top:2px;bottom:0;width:10px;margin-left:-5px;background:rgba(255,255,255,.35);z-index:3}
.crate .lock{position:absolute;left:50%;top:12px;width:12px;height:10px;margin-left:-6px;border-radius:2px;background:#ffd257;z-index:4;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.crate.ready{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.crate.big{transform:scale(1.8);margin:60px auto 30px}
.crate.shake{animation:shake .25s 3}
@keyframes shake{25%{transform:scale(1.8) rotate(-8deg)}75%{transform:scale(1.8) rotate(8deg)}}
.crate.opened .lid,.crate.opened .lock,.crate.opened .band{transform:translateY(-12px) rotate(-18deg)}
.crate.opened::after{content:"";position:absolute;left:50%;top:14px;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(#fff6b0,rgba(255,210,87,0) 65%);animation:glow .6s ease-out forwards;z-index:1}
@keyframes glow{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.crate.ready,.crate.shake{animation:none}}
.bxfree{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bxshop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bxcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;display:grid;gap:6px;justify-items:center;text-align:center;min-width:0}
.bxcard b{font-size:13px}.bxcard small{color:var(--muted);font-size:11px;line-height:1.35}
.bxcard .btn{min-width:0;width:100%;padding-inline:6px;font-variant-numeric:tabular-nums}
.boxov{justify-items:center}
.rwd{display:grid;gap:4px;justify-items:center}
.rwd b{font:800 20px var(--f-disp)}.rwd small{color:var(--muted)}
.rwi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 22px var(--f-num)}
.tgls{display:flex;gap:8px;flex-wrap:wrap}
.tgl{display:inline-flex;align-items:center;gap:8px;font:700 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.tgl span{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.tgl span::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on span{background:var(--gold)}.tgl.on span::after{transform:translateX(12px)}
.tgl:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.lg.box{background:#b98a5a;border-radius:4px}
.lbnote{font-size:12px;color:var(--muted);padding:10px 12px;line-height:1.45}

const PERIOD=6e4; // доход начисляется за каждую минуту

const cardLvl=c=>S.cards[c.sym]||0;
const cardInc=c=>{const l=cardLvl(c);return l?c.inc*Math.pow(1.35,l-1):0};
const buffOn=k=>(S.active[k]||0)>Date.now();
const mineMul=()=>recMul()*(buffOn('mine2x')?2:1)*(S.perks.premium?1.5:1)*(buffOn('newbie')?1.4:1);
const cardCost=c=>Math.round(c.cost*Math.pow(1.4,cardLvl(c))*(buffOn('discount')?0.8:1));
const rate=()=>COINS.reduce((a,c)=>a+cardInc(c),0)*mineMul(); // доход за 10 минут
const offCap=()=>S.perks.offline?12:3; // часов
const upgLvl=k=>S.upg[k]||0;
const upgCost=u=>Math.round(u.base*Math.pow(1.6,upgLvl(u.k)));

let pending=0;
function accrue(){const now=Date.now();const periods=Math.min((now-S.last)/PERIOD,offCap()*36e5/PERIOD);pending+=rate()*Math.max(0,periods);S.last=now}
accrue();

    live=true;priceTime=new Date().toLocaleTimeString(LANG==='en'?'en-GB':LANG==='uk'?'uk-UA':'ru-RU',{hour:'2-digit',minute:'2-digit'});

/* ===== Персонаж ===== */
function rrect(x,X,Y,w,h,r){x.beginPath();if(x.roundRect){x.roundRect(X,Y,w,h,r)}else{x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}}
function drawHero(x,cx,cy,sk,s=1){
  x.save();x.translate(cx,cy);x.scale(s,s);
  x.fillStyle=sk.body;rrect(x,-14,-16,28,30,9);x.fill();
  x.fillStyle='rgba(0,0,0,.18)';x.fillRect(-14,8,28,6);
  x.fillStyle=sk.eye;x.beginPath();x.arc(-5,-4,3,0,7);x.arc(5,-4,3,0,7);x.fill();
  if(sk.acc==='laser'){x.strokeStyle='#ff3b3b';x.lineWidth=2;x.globalAlpha=.8;x.beginPath();x.moveTo(-5,-4);x.lineTo(-22,6);x.moveTo(5,-4);x.lineTo(22,6);x.stroke();x.globalAlpha=1}
  if(sk.acc==='spout'){x.fillStyle='#9fd3ff';x.beginPath();x.arc(-3,-22,3,0,7);x.arc(3,-23,2.5,0,7);x.arc(0,-26,2.5,0,7);x.fill()}
  if(sk.acc==='hat'){x.fillStyle='#e85d75';x.fillRect(-14,-20,28,6);x.beginPath();x.arc(0,-22,4,0,7);x.fill()}
  if(sk.acc==='helmet'){x.strokeStyle='#ffffff';x.lineWidth=2;x.globalAlpha=.7;x.beginPath();x.arc(0,-2,19,0,7);x.stroke();x.globalAlpha=1}
  if(sk.acc==='gem'){x.fillStyle='#5fd4ee';x.beginPath();x.moveTo(0,-30);x.lineTo(8,-22);x.lineTo(0,-16);x.lineTo(-8,-22);x.fill();x.fillStyle='#fff';x.fillRect(-18,-14,3,3);x.fillRect(16,2,3,3)}
  if(sk.acc==='crown'){x.fillStyle='#fff3b0';x.beginPath();x.moveTo(-10,-16);x.lineTo(-10,-24);x.lineTo(-5,-19);x.lineTo(0,-26);x.lineTo(5,-19);x.lineTo(10,-24);x.lineTo(10,-16);x.fill()}
  x.fillStyle=sk.eye;x.font='bold 11px JetBrains Mono, monospace';x.textAlign='center';x.fillText('₿',0,9);
  x.restore();
}

const ZONES=[
  {n:A('Луг','Луг','Meadow'),top:'#bfe9cf',bot:'#f4fbf6',plat:'#1d9e57',dark:0,deco:'meadow'},

  {n:A('Пустыня','Пустеля','Desert'),top:'#f7d58b',bot:'#fff3d6',plat:'#c98a2b',dark:0,deco:'desert'},

  {n:A('Неон','Неон','Neon'),top:'#1a0533',bot:'#4a0f6b',plat:'#ff3fb4',dark:1,deco:'neon'},

];
ZONES.forEach((z,i)=>z.req=i*750);
const ZSTEP=750;
const bgOpen=i=>S.record>=ZONES[i].req;

function zStars(x,W,H,cam,n,seed,tw,tt){
  for(let i=0;i<n;i++){const sx=((i*97+seed*31)%W),sy=(((i*173+seed*57)+cam*.15)%H);const a=tw?(.4+.6*Math.abs(Math.sin(tt*.03+i))):.8;
    x.globalAlpha*=a;x.fillStyle='#fff';x.fillRect(sx,sy,i%7?1.5:2.5,i%7?1.5:2.5);x.globalAlpha/=a}
}
function zCloud(x,cx,cy,s,col){x.fillStyle=col;x.beginPath();x.ellipse(cx,cy,26*s,11*s,0,0,7);x.ellipse(cx+18*s,cy-6*s,16*s,10*s,0,0,7);x.ellipse(cx-16*s,cy-3*s,14*s,8*s,0,0,7);x.fill()}
function drawZone(x,W,H,z,cam,tt){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,z.top);g.addColorStop(1,z.bot);x.fillStyle=g;x.fillRect(0,0,W,H);
  const d=z.deco,par=cam*.12;
  if(d==='meadow'){x.fillStyle='#fff3b0';x.beginPath();x.arc(W-54,70,26,0,7);x.fill();
    for(let i=0;i<5;i++)zCloud(x,((i*131+tt*.15)%(W+80))-40,((i*157+par)%H),.9+(i%3)*.2,'rgba(255,255,255,.85)');
    x.fillStyle='rgba(29,158,87,.18)';x.beginPath();x.ellipse(W*.25,H+30,W*.5,70,0,0,7);x.ellipse(W*.85,H+40,W*.45,80,0,0,7);x.fill()}
  if(d==='sunset'){x.fillStyle='rgba(255,236,170,.9)';x.beginPath();x.arc(W/2,H*.72,70,0,7);x.fill();

let G=null,raf=0,keysOff=null;

function play(){

  const startZ=S.bg||0;
  G={p:{x:W/2,y:H-120,vx:0,vy:jumpV},plats:[],coins:[],items:[],pops:[],cam:bRocket?5000:0,maxH:bRocket?500:0,coinSum:0,trampSum:0,shield:upgLvl('shield')+(bShield?2:0),dir:0,t:0,x2:0,heli:0,tramp:false,zone:-1,picked:{x2:0,heli:0,tramp:0,box:0}};
  if(bRocket)toast(t('rocketT'));
  function rnd(a,b){return a+Math.random()*(b-a)}
  function addPlat(y){
    const h=G.maxH,r=Math.random();
    let type='n';if(h>800&&r<.18)type='m';if(h>1500&&r>.86)type='b';if(r>.93)type='s';if(h>150&&r>.89&&r<=.93)type='t';
    const w=type==='t'?64:Math.max(46,72-h/400);
    const pl={x:rnd(0,W-w),y,w,type,vx:type==='m'?(Math.random()<.5?-1:1)*(1.2+h/4000):0,broken:false};
    G.plats.push(pl);
    const q=Math.random();

    else if(type==='n'&&h>300&&q>.022&&q<.034)G.items.push({x:pl.x+pl.w/2,y:y-22,k:'box'});

  addEventListener('keydown',keys);addEventListener('keyup',keys);

  const dirAt=cx=>{const r=cv.getBoundingClientRect();return cx-r.left<r.width/2?-1:1};

        if(pl.type==='b'){pl.broken=true;continue}
        g.tramp=false;
        if(pl.type==='t'){sfx('tramp');p.vy=jumpV*2.2;g.tramp=true;g.picked.tramp++;const bonus=(2+g.maxH/150)*(S.perks.vip?2:1);g.trampSum+=bonus;pop(p.x,p.y-20,'+'+money(bonus)+' ×2','#ff5a5a');haptic('success')}

      if(d<mag+(g.heli?40:0)&&(upgLvl('magnet')||bCoins||g.heli)){c.x+=dx*.15;c.y+=dy*.15}
      if(d<22){c.got=true;sfx('coin');const v=coinVal*(1+g.maxH/2000)*mult;g.coinSum+=v;if(mult>1)pop(c.x,c.y,'×'+mult,'#7b4dff');haptic('light')}}
    for(const it of g.items){if(it.got)continue;if(Math.hypot(p.x-it.x,p.y-it.y)<26){it.got=true;g.picked[it.k]++;
      if(it.k==='box'){sfx('box');pop(it.x,it.y,t('it_box'),'#b98a5a')}

    let top=Math.min(...g.plats.map(q=>q.y));while(top>-60){top-=55+Math.random()*(35+Math.min(g.maxH/40,40));addPlat(top)}
    if(p.y>H+30){if(g.shield>0){g.shield--;p.y=H-10;p.vy=jumpV*1.8;sfx('shield');toast(t('shieldT'))}else return end()}
    draw();raf=requestAnimationFrame(step);
  }
  function drawHeliHat(px,py){x.save();x.translate(px,py-20);x.fillStyle='#ff5a5a';x.beginPath();x.arc(0,0,7,Math.PI,0);x.fill();x.fillStyle='#333';x.fillRect(-1,-12,2,6);
    const a=G.t*.6;x.strokeStyle='#333';x.lineWidth=3;x.beginPath();x.moveTo(-20*Math.cos(a),-12);x.lineTo(20*Math.cos(a),-12);x.stroke();x.restore()}
  function draw(){
    const g=G,h=g.maxH,za=zoneAt(h),zb=(za+1)%ZONES.length,frac=h%ZSTEP,f=frac>680?(frac-680)/70:0;

      x.fillStyle='rgba(0,0,0,.25)';for(let i=6;i<pl.w-4;i+=10)x.fillRect(pl.x+i,pl.y+3,5,6);

const BOX_FREE_MS=2*36e5,BOX_DAY_MS=24*36e5;
const BOXES=[
  {k:'free',col:'#5f9e74',lid:'#4b8a60',free:true},
  {k:'daily',col:'#3f8fd6',lid:'#2f78bd',daily:true},
  {k:'wood',col:'#b98a5a',lid:'#9a6f45',cost:2000,drop:[['cash',45],['mine30',20],['super3',15],['hero',15],['pc',5]],mul:[.6,2]},
  {k:'iron',col:'#8794a8',lid:'#6c7a90',cost:10000,drop:[['cash',40],['mine2h',20],['rocket3',15],['hero',15],['pc',10]],mul:[.7,2.4]},
  {k:'gold',col:'#e0a82e',lid:'#c38c16',cost:50000,drop:[['cash',35],['mine8h',15],['coins10',10],['hero2',20],['pc',20]],mul:[.8,3]},
];
const FREE_DROP=[['cash',60],['mine30',20],['coins3',15],['hero',5]];
const DAILY_DROP=[['cash',55],['mine2h',20],['rocket3',10],['hero',10],['pc',5]];
const bx=()=>S.boxes||(S.boxes={});
const boxName=k=>t('box_'+k);
function rollDrop(d){const tot=d.reduce((a,x)=>a+x[1],0);let r=Math.random()*tot;for(const [k,w] of d){if((r-=w)<0)return k}return d[0][0]}
function rewardFor(b,k,streak){
  // возвращает {icon, title, desc, apply}
  const inc10=rate()*10;
  if(k==='cash'){let v;
    if(b.free)v=Math.max(200,rate()*20);
    else if(b.daily)v=Math.max(1000,rate()*120)*(1+Math.min(streak,7)*.1);
    else{const [a,z]=b.mul;v=Math.max(b.cost*(a+Math.random()*(z-a)),inc10)}
    v=Math.round(v);return{icon:'$',col:'#14a053',title:money(v),desc:t('rw_cash'),apply:()=>earn(v)}}
  if(k==='hero'||k==='hero2'){const n=k==='hero2'?2:1,pool=UPG.filter(u=>upgLvl(u.k)<u.max);
    if(!pool.length)return rewardFor(b,'cash',streak);const u=pool[Math.floor(Math.random()*pool.length)],add=Math.min(n,u.max-upgLvl(u.k));
    return{icon:'↑',col:'#7b4dff',title:L(u.name)+' +'+add,desc:t('rw_hero'),apply:()=>{S.upg[u.k]=upgLvl(u.k)+add}}}
  if(k==='pc'){const pool=COINS.filter(c=>cardLvl(c)>0);if(!pool.length)return rewardFor(b,'cash',streak);
    const c=pool[Math.floor(Math.random()*pool.length)];return{icon:'▣',col:c.col,title:c.sym+' +1 '+t('lvl'),desc:t('rw_pc'),apply:()=>{S.cards[c.sym]=cardLvl(c)+1}}}
  const B=BUFFS[k];return{icon:'⚡',col:'#d1901a',title:L(B.n),desc:L(B.d),apply:()=>applyBuff(k)}
}
function boxArt(b,cls=''){return`<div class="crate ${cls}" style="--bc:${b.col};--bl:${b.lid}"><i class="lid"></i><i class="band"></i><i class="lock"></i></div>`}
function fmtClock(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`:`${m}:${String(ss).padStart(2,'0')}`}
function openBox(k,src){
  const b=BOXES.find(x=>x.k===k);const X=bx();let streak=0,drop;
  if(src==='inv'){if(!(X['inv_'+k]>0))return;X['inv_'+k]--;drop=b.drop||FREE_DROP}
  else if(b.free){if(Date.now()<(X.freeAt||0))return;X.freeAt=Date.now()+BOX_FREE_MS;drop=FREE_DROP}
  else if(b.daily){const now=Date.now();if(now<(X.dayAt||0))return;streak=(now-(X.dayLast||0)<2*BOX_DAY_MS)?(X.streak||0)+1:1;X.streak=streak;X.dayLast=now;X.dayAt=now+BOX_DAY_MS;drop=DAILY_DROP}
  else{if(S.bal<b.cost)return;S.bal-=b.cost;drop=b.drop}
  const rw=rewardFor(b,rollDrop(drop),streak);rw.apply();S.boxN=(S.boxN||0)+1;save();refresh();
  const d=document.createElement('div');d.className='overlay';d.style.position='fixed';d.style.zIndex=30;
  d.innerHTML=`<div class="ov boxov"><span class="rar" style="color:${b.col}">${boxName(k)}</span>${boxArt(b,'big shake')}
    <div class="rwd" hidden><span class="rwi" style="background:${rw.col}">${rw.icon}</span><b>${rw.title}</b><small>${rw.desc}</small>${b.daily?`<small>${t('streak',{n:streak})}</small>`:''}</div>
    <button class="btn" id="bxok" hidden>${t('take')}</button></div>`;
  document.body.appendChild(d);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){sfx('shake');setTimeout(()=>sfx('shake'),250);setTimeout(()=>sfx('shake'),500)}
  setTimeout(()=>{const cr=d.querySelector('.crate');cr.classList.remove('shake');cr.classList.add('opened');sfx('open');
    setTimeout(()=>{d.querySelector('.rwd').hidden=false;d.querySelector('#bxok').hidden=false;sfx('reveal');haptic('success')},reduce?0:350)},reduce?0:800);
  d.querySelector('#bxok').onclick=()=>{d.remove();checkAch();render()};
}
function renderBoxes(m){
  const X=bx(),now=Date.now(),fr=Math.max(0,(X.freeAt||0)-now),dr=Math.max(0,(X.dayAt||0)-now);
  const invK=BOXES.filter(b=>X['inv_'+b.k]>0);
  m.innerHTML=`<h2>${t('tBoxes')}</h2><p class="sub">${t('boxSub')}</p>
  <div class="bxfree">${BOXES.filter(b=>b.free||b.daily).map(b=>{const left=b.free?fr:dr;return`<div class="bxcard">${boxArt(b,left?'':'ready')}<b>${boxName(b.k)}</b>
    <small>${b.free?t('freeEvery'):t('dailyEvery',{n:(X.streak||0)})}</small>
    <button class="btn" data-bxopen="${b.k}" ${left?'disabled':''}><span data-cd="${b.k}">${left?fmtClock(left):t('openFree')}</span></button></div>`}).join('')}</div>
  ${invK.length?`<div class="sect">${t('boxInv')}</div><div class="stack">${invK.map(b=>`<div class="card"><div class="chip" style="background:${b.col}"><span>×${X['inv_'+b.k]}</span></div><div class="meta"><b>${boxName(b.k)}</b><span class="l">${t('boxFoundIn')}</span></div><button class="btn" data-bxinv="${b.k}">${t('open')}</button></div>`).join('')}</div>`:''}
  <div class="sect">${t('boxShop')}</div>
  <div class="bxshop">${BOXES.filter(b=>b.cost).map(b=>`<div class="bxcard">${boxArt(b)}<b>${boxName(b.k)}</b>
    <small>${b.drop.map(([k,w])=>t('dr_'+(BUFFS[k]?'buff':k))).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')}</small>
    <button class="btn" data-bxbuy="${b.k}" ${S.bal<b.cost?'disabled':''}>${money(b.cost)}</button></div>`).join('')}</div>
  <p class="note">${t('boxNote')}</p>`;
  m.querySelectorAll('[data-bxopen]').forEach(e=>e.onclick=()=>openBox(e.dataset.bxopen));
  m.querySelectorAll('[data-bxbuy]').forEach(e=>e.onclick=()=>openBox(e.dataset.bxbuy));
  m.querySelectorAll('[data-bxinv]').forEach(e=>e.onclick=()=>openBox(e.dataset.bxinv,'inv'));
}
function boxReady(){const X=bx(),n=Date.now();return n>=(X.freeAt||0)||n>=(X.dayAt||0)||BOXES.some(b=>X['inv_'+b.k]>0)}
function boxTick(){
  const dot=$('#tab-boxes');if(dot)dot.classList.toggle('dot',boxReady());
  if(tab!=='boxes')return;const X=bx(),n=Date.now();
  for(const [k,at] of [['free',X.freeAt||0],['daily',X.dayAt||0]]){const el=document.querySelector(`[data-cd="${k}"]`);if(!el)continue;const left=at-n;
    if(left>0)el.textContent=fmtClock(left);else if(el.closest('button').disabled){render();return}}
}

/* ===== Рейтинг =====
   1) в Telegram с сервером (server.js): /api/top и /api/score
   2) в превью Claude: общая база артефакта
   3) иначе: только локальный результат */
const LB={mode:'local',rows:[],me:null,db:null,last:'',
  async init(){
    // сервер на бесплатном хостинге может просыпаться до минуты — пробуем несколько раз
    for(let i=0;i<4;i++){
      try{const r=await fetch('api/top',{cache:'no-store'});if(r.ok&&(r.headers.get('content-type')||'').includes('json')){this.mode='server';const jj=await r.json();this.rows=jj.players||[];if(jj.bot)S.bot=jj.bot;if(tab==='profile')render();
        await this.push(true);setInterval(()=>this.pull(),30000);setInterval(()=>this.push(true),300000);return}
        if(r.status===404)break}catch(e){}
      await new Promise(r=>setTimeout(r,5000));
    }
    try{
      if(window.claude?.use){const db=await claude.use('db'),user=await claude.use('user');
        if(db&&user){const id=await user.id();if(id){this.db=db;this.me=id;this.mode='claude';
          db.collection('players').orderBy('record','desc').limit(200).onSnapshot(q=>{this.rows=q.docs.map(d=>({id:d.id,...d.data()}));if(tab==='profile')render()},()=>{});
          this.push(true);return}}}
    }catch(e){}
  },
  async pull(){if(this.mode!=='server')return;await this.push();try{const r=await fetch('api/top',{cache:'no-store'});this.rows=(await r.json()).players||[];if(tab==='profile')render()}catch(e){}},
  async push(force){
    if(this.mode==='local')return;
    const sig=JSON.stringify({...playerCard(),ts:0});if(!force&&sig===this.last)return;this.last=sig;
    try{
      if(this.mode==='claude')await this.db.collection('players').doc(this.me).set(playerCard());
      if(this.mode==='server'){const r=await fetch('api/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData:window.Telegram?.WebApp?.initData||'',pid:S.pid,...playerCard()})});const j=await r.json();if(j.players){this.rows=j.players;this.me=j.me}if(tab==='profile')render()}
    }catch(e){}
  },
  list(){
    if(this.mode==='local')return[{id:'me',...playerCard(),isMe:true}];
    const rows=this.rows.map(r=>({...r,isMe:r.id===this.me}));
    if(!rows.some(r=>r.isMe))rows.push({id:this.me,...playerCard(),isMe:true});
    return rows.sort((a,b)=>b.record-a.record||b.earned-a.earned);
  }
};

  <div class="prog">${COINS.map(c=>`<div class="prow"><span><b>${c.sym}</b></span><div class="bar"><i style="width:${Math.min(cardLvl(c)/10,1)*100}%"></i></div><span>${cardLvl(c)?t('lvl')+' '+cardLvl(c):'—'}</span></div>`).join('')}</div>
  <div class="sect">${t('heroOf',{a:Object.keys(S.skins).length,b:SKINS.length})}</div>
  <div class="prog">${UPG.map(u=>`<div class="prow"><span style="font-size:12px">${L(u.name)}</span><div class="bar"><i style="width:${upgLvl(u.k)/u.max*100}%"></i></div><span>${upgLvl(u.k)}/${u.max}</span></div>`).join('')}</div>
  <div class="sect">${t('rating')}</div>
  <div class="lb">${rows.slice(0,200).map((r,i)=>`<div class="lr ${r.isMe?'me':''}"><span class="n">${medal(i)}</span>${avHTML(r.avatar,"av")}<span class="nm" data-nm="${i}"></span><span class="sc">${r.record}<small>${money(r.earned||0)}</small></span></div>`).join('')}
  ${LB.mode==='local'?`<div class="lbnote">${t('lbLocal')}</div>`:''}</div>
  <div class="sect">${t('achs')}</div>
  <div class="achs">${ACH.map(a=>`<div class="ach ${S.ach[a.k]?'on':'off'}"><b>${S.ach[a.k]?'✓ ':''}${L(a.n)}</b><small>${L(a.d)}</small><span class="rw">+${money(a.r)}</span></div>`).join('')}</div>`;
  $('#pname').value=S.name;
  rows.slice(0,200).forEach((r,i)=>{m.querySelector(`[data-nm="${i}"]`).textContent=(r.name||t('player'))+(r.isMe?' '+t('you'):'')});
  const big=$('#pav [data-emo]');if(big)big.textContent=myAvatar();
  m.querySelectorAll('.lr').forEach((row,i)=>{const e=row.querySelector('[data-emo]');if(e)e.textContent=String(rows[i].avatar||'').slice(0,8)});
  paintAv(m);
  m.querySelectorAll('[data-avpick]').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.avpick;save();LB.push();render()});
  bindLang(m);bindRef(m);bindSound(m);
  $('#psave').onclick=()=>{const v=$('#pname').value.trim().replace(/\s+/g,' ').slice(0,18);if(v.length<2){toast(t('nameShort'));return}S.name=v;save();LB.push();toast(t('nameSaved'));render()};
  $('#pname').onkeydown=e=>{if(e.key==='Enter')$('#psave').click()};
}

function refLink(){const tid=S.refId||(()=>{try{const u=window.Telegram?.WebApp?.initDataUnsafe?.user;return u?'tg'+u.id:''}catch(e){return''}})();return(S.bot&&tid)?`https://t.me/${S.bot}?start=ref_${tid}`:''}
function refBlock(){const link=refLink();return`<div class="ref"><div class="big">+$200 × 2</div><p class="sub" style="margin:0">${t('refSub',{v:'$200'})}</p>
  ${link?`<div class="reflink"><input id="reflink" readonly aria-label="${t('refH')}"></div><div class="refbtns"><button class="btn ghost" id="refcopy">${t('copy')}</button><button class="btn" id="refshare">${t('share')}</button></div>`:`<p class="note" style="margin:0">${t('refNo')}</p>`}
  <div class="kv"><span>${t('refCount',{n:''}).replace(/[:\s]+$/,'')}</span><b>${S.refCount||0}</b></div></div>`}
function bindRef(m){const link=refLink(),inp=m.querySelector('#reflink');if(!inp)return;inp.value=link;
  m.querySelector('#refcopy').onclick=()=>{const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(link).then(done,()=>{inp.select();document.execCommand('copy');done()})}catch(e){inp.select();try{document.execCommand('copy')}catch(_){}done()}};
  m.querySelector('#refshare').onclick=()=>{const u='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t('shareText'));const tg=window.Telegram?.WebApp;if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else{const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.click()}}}
function showWelcome(d){
  d.innerHTML=`<div class="ov"><h3>${t('title')}</h3><div style="display:flex;justify-content:center">${langSwitch()}</div><div class="big">+$1000</div><p>${t('welcome')}${t('newbieW')}</p><button class="btn" id="wok">${t('start')}</button></div>`;
  bindLang(d);$('#wok').onclick=()=>d.remove();
}

/* ===== Старт ===== */
try{const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor?.('#f2f8f3');tg.setBackgroundColor?.('#f2f8f3')}}catch(e){}
applyStatic();renderTicker();refresh();render();loadPrices();LB.init().then(()=>{claimStars();if(tab==='store'||tab==='profile')render()});setTimeout(checkAch,800);
setInterval(()=>LB.push(),60000);setInterval(claimStars,60000);setInterval(boxTick,1000);boxTick();setInterval(loadPrices,60000);
setInterval(()=>{accrue();save();const pe=$('#pend');if(pe)pe.textContent=money(pending);const b=$('#claim');if(b)b.disabled=pending<0.01;refresh()},1000);
if(S.welcomed&&!S.newbieGiven){S.newbieGiven=true;S.active.newbie=Date.now()+36e5;save();setTimeout(()=>toast(t('newbie',{t:fmtLeft(36e5)})),600)}
if(!S.welcomed){
  S.welcomed=true;earn(1000);S.newbieGiven=true;S.active.newbie=Date.now()+36e5;save();refresh();
  const d=document.createElement('div');d.className='overlay welcome';d.style.position='fixed';d.style.zIndex=30;
  document.body.appendChild(d);showWelcome(d);
}
</script>
</body>
</html>
